<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Học Thuộc Lòng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .word-box { display: inline-block; margin: 2px; }
        .hidden-word { cursor: pointer; user-select: none; }
        .input-word { 
            text-align: center; 
            border-bottom: 2px solid #ccc; 
            outline: none; 
            background-color: transparent; 
            max-width: 100%; 
            padding: 0 4px;
        }
        .input-word:focus { border-bottom-color: #3b82f6; }
        
        .input-wrong-memory {
            border: 2px dashed #f97316 !important;
            background-color: #fff7ed !important;
            border-radius: 4px;
        }

        @keyframes flashRed {
            0% { background-color: #fca5a5; }
            100% { background-color: transparent; }
        }
        .flash-error { animation: flashRed 0.5s ease-out; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-3 md:p-8 font-sans text-gray-800">
    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
        
        <!-- CỘT TRÁI: QUẢN LÝ DỮ LIỆU -->
        <div id="leftColumn" class="md:col-span-1 space-y-4 md:space-y-6">
            <div class="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-3 md:mb-4">
                    <h2 class="font-bold text-base md:text-lg text-blue-700 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        1. Soạn thảo
                    </h2>
                    <span id="saveStatus" class="text-[10px] md:text-xs text-gray-400 italic"></span>
                </div>
                
                <input type="text" id="lessonTitle" placeholder="Tên bài (Tự lấy 2 dòng đầu)" class="w-full mb-3 p-2.5 md:p-3 border rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none bg-gray-50 text-sm font-semibold">
                
                <select id="lessonSubject" class="w-full mb-3 p-2.5 md:p-3 border rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none bg-gray-50 text-sm text-gray-600 truncate">
                    <option value="">-- Chọn Môn học --</option>
                    <option value="Ngữ văn">Ngữ văn</option>
                    <option value="Toán học">Toán học</option>
                    <option value="Tiếng Anh">Tiếng Anh</option>
                    <option value="Lịch sử">Lịch sử</option>
                    <option value="Giáo dục thể chất">Giáo dục thể chất</option>
                    <option value="Giáo dục quốc phòng và an ninh">GD quốc phòng và an ninh</option>
                    <option value="Hoạt động trải nghiệm, hướng nghiệp">HĐ trải nghiệm, hướng nghiệp</option>
                    <option value="Nội dung giáo dục của địa phương">ND giáo dục địa phương</option>
                    <option value="Vật lí">Vật lí</option>
                    <option value="Hóa học">Hóa học</option>
                    <option value="Sinh học">Sinh học</option>
                    <option value="Địa lí">Địa lí</option>
                    <option value="Giáo dục kinh tế và pháp luật">GD kinh tế và pháp luật</option>
                    <option value="Công nghệ thông tin và Nghệ thuật">CNTT và Nghệ thuật</option>
                </select>

                <textarea id="sourceText" rows="5" placeholder="Nhập văn bản cần học thuộc lòng..." class="w-full p-2.5 md:p-3 border rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none bg-gray-50 mb-3 text-sm"></textarea>
                
                <div class="flex gap-2">
                    <button id="btnNewLesson" class="w-1/2 bg-emerald-500 text-white font-bold py-2 md:py-2.5 px-2 rounded-lg hover:bg-emerald-600 transition duration-200 shadow-sm flex items-center justify-center text-xs md:text-sm">
                        <svg class="w-4 h-4 mr-1 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Nhập Bài Mới
                    </button>
                    <button id="btnSave" class="w-1/2 bg-blue-600 text-white font-bold py-2 md:py-2.5 px-2 rounded-lg hover:bg-blue-700 transition duration-200 shadow-sm flex items-center justify-center text-xs md:text-sm">
                        <svg class="w-4 h-4 mr-1 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                        Lưu Bài
                    </button>
                </div>
            </div>

            <div class="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-gray-100">
                <h2 class="font-bold text-base md:text-lg mb-3 md:mb-4 text-blue-700 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                    Thư viện bài học
                </h2>
                <div id="lessonList" class="space-y-2 text-sm max-h-[250px] md:max-h-[350px] overflow-y-auto pr-2">
                    <p class="text-gray-500 italic">Đang tải dữ liệu từ Cloud...</p>
                </div>
            </div>
        </div>

        <!-- CỘT PHẢI: KHU VỰC TƯƠNG TÁC HỌC TẬP -->
        <div id="rightColumn" class="md:col-span-2 space-y-4 md:space-y-6">
            
            <!-- Nút quay lại dành riêng cho Mobile -->
            <button id="btnBackMobile" class="hidden md:hidden w-full bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl flex items-center justify-center transition-colors hover:bg-slate-300">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Quay lại Danh sách & Soạn thảo
            </button>

            <div class="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-gray-100 min-h-[400px] md:min-h-[600px] flex flex-col">
                <div class="flex justify-between items-center mb-3 md:mb-4">
                    <h2 class="font-bold text-base md:text-lg text-blue-700 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                        2. Khu vực luyện tập
                    </h2>
                    <span id="wrongWordsTracker" class="text-[10px] md:text-xs text-orange-500 font-bold bg-orange-100 px-2 py-1 rounded hidden">Sổ tay: 0 từ khó</span>
                </div>

                <div class="grid grid-cols-3 gap-2 md:gap-3 mb-4 md:mb-6">
                    <button id="btnMode1" class="py-2 md:py-3 px-1 md:px-2 bg-indigo-50 text-indigo-700 font-semibold rounded-lg hover:bg-indigo-100 border border-indigo-200 transition text-[11px] sm:text-xs md:text-sm">👆 Chạm mở từ</button>
                    <button id="btnMode2" class="py-2 md:py-3 px-1 md:px-2 bg-emerald-50 text-emerald-700 font-semibold rounded-lg hover:bg-emerald-100 border border-emerald-200 transition text-[11px] sm:text-xs md:text-sm">✍️ Điền chỗ</button>
                    <button id="btnMode3" class="py-2 md:py-3 px-1 md:px-2 bg-amber-50 text-amber-700 font-semibold rounded-lg hover:bg-amber-100 border border-amber-200 transition text-[11px] sm:text-xs md:text-sm">⌨️ Chữ cái đầu</button>
                </div>
                
                <div class="bg-slate-50 p-4 md:p-6 border rounded-xl flex-grow text-lg md:text-xl leading-[2.2] md:leading-loose overflow-y-auto break-words whitespace-pre-wrap" id="practiceArea">
                    <div class="text-center mt-10 md:mt-20 text-gray-400">
                        <svg class="w-12 h-12 md:w-16 md:h-16 mx-auto mb-3 md:mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        <p class="text-sm md:text-base">Kết quả sẽ hiển thị ở đây. Hãy chọn một bài học và chọn chế độ bên trên...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, orderBy, query, doc, updateDoc, deleteDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7dUr9hu-FJmcrb9oxUZ9rSY2nUzXobbw",
            authDomain: "htlmylan.firebaseapp.com",
            projectId: "htlmylan",
            storageBucket: "htlmylan.firebasestorage.app",
            messagingSenderId: "451089656401",
            appId: "1:451089656401:web:fa2837b5977f08b8a5e670"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentLessonId = null;
        let globalWrongWords = []; 
        const globalStatsRef = doc(db, "settings", "wrongWordsDict");

        // Xử lý nút Back trên Mobile
        document.getElementById("btnBackMobile").addEventListener("click", () => {
            document.getElementById("leftColumn").classList.remove("hidden", "md:block");
            document.getElementById("btnBackMobile").classList.add("hidden");
        });

        const loadGlobalWrongWords = async () => {
            try {
                const docSnap = await getDoc(globalStatsRef);
                if (docSnap.exists()) {
                    globalWrongWords = docSnap.data().words || [];
                } else {
                    await setDoc(globalStatsRef, { words: [] });
                }
                updateWrongWordsUI();
            } catch (error) {
                console.error("Lỗi tải Sổ tay từ khó:", error);
            }
        };

        const addWrongWord = async (word) => {
            if (!globalWrongWords.includes(word)) {
                globalWrongWords.push(word);
                updateWrongWordsUI();
                try {
                    await updateDoc(globalStatsRef, { words: globalWrongWords });
                } catch(e) { console.error(e); }
            }
        };

        const removeWrongWord = async (word) => {
            if (globalWrongWords.includes(word)) {
                globalWrongWords = globalWrongWords.filter(w => w !== word);
                updateWrongWordsUI();
                try {
                    await updateDoc(globalStatsRef, { words: globalWrongWords });
                } catch(e) { console.error(e); }
            }
        };

        const updateWrongWordsUI = () => {
            const tracker = document.getElementById("wrongWordsTracker");
            if(globalWrongWords.length > 0) {
                tracker.classList.remove("hidden");
                tracker.innerText = `Sổ tay: ${globalWrongWords.length} từ khó`;
            } else {
                tracker.classList.add("hidden");
            }
        };

        loadGlobalWrongWords();
        
        const loadLessons = async () => {
            const listEl = document.getElementById("lessonList");
            try {
                const q = query(collection(db, "lessons"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                listEl.innerHTML = "";
                
                if(querySnapshot.empty) {
                    listEl.innerHTML = "<p class='text-gray-500 italic text-sm'>Chưa có bài học nào được lưu.</p>";
                    return;
                }

                querySnapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    const docId = docSnapshot.id;
                    
                    let timeString = "Chưa rõ thời gian";
                    if(data.timestamp) {
                        const dateObj = data.timestamp.toDate();
                        const time = dateObj.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                        const date = dateObj.toLocaleDateString('vi-VN');
                        timeString = `${time} - ${date}`;
                    }

                    const subjectBadge = data.subject ? `<span class="bg-blue-100 text-blue-700 text-[10px] sm:text-xs px-1.5 sm:px-2 py-0.5 rounded mr-1.5 font-medium truncate max-w-[100px] inline-block">${data.subject}</span>` : '';

                    const div = document.createElement("div");
                    div.className = "p-2.5 md:p-3 bg-white border border-gray-100 shadow-sm rounded-lg cursor-pointer hover:border-blue-300 hover:shadow-md transition group";
                    div.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <div class="font-semibold text-sm text-gray-800 group-hover:text-blue-600 transition flex-1 pr-2 line-clamp-2">${data.title || "Bài chưa đặt tên"}</div>
                            <button class="delete-btn text-gray-300 hover:text-red-500 transition-colors p-1" title="Xóa bài này">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                        <div class="flex items-center text-[10px] md:text-xs text-gray-500 mt-1 whitespace-nowrap overflow-hidden">
                            ${subjectBadge}
                            <svg class="w-3 h-3 mr-1 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span class="truncate">${timeString}</span>
                        </div>
                    `;
                    
                    div.onclick = () => {
                        currentLessonId = docId;
                        document.getElementById("lessonTitle").value = data.title || "";
                        document.getElementById("lessonSubject").value = data.subject || "";
                        document.getElementById("sourceText").value = data.content || "";
                        document.getElementById("saveStatus").innerText = "Đã tải bài học";
                        
                        document.getElementById("practiceArea").innerHTML = `
                            <div class="text-center mt-6 md:mt-10">
                                <span class="inline-block px-3 md:px-4 py-1 bg-blue-100 text-blue-700 rounded-full text-xs md:text-sm font-semibold mb-3 md:mb-4">Đã mở bài học</span>
                                <p class="text-gray-500 mt-1 md:mt-2 text-sm md:text-base">Hãy chọn chế độ ở menu trên để bắt đầu học.</p>
                            </div>
                        `;
                        
                        if(window.innerWidth < 768) {
                            document.getElementById("leftColumn").classList.add("hidden", "md:block");
                            document.getElementById("btnBackMobile").classList.remove("hidden");
                            window.scrollTo(0, 0);
                        }
                    };

                    const deleteBtn = div.querySelector('.delete-btn');
                    deleteBtn.onclick = async (e) => {
                        e.stopPropagation(); 
                        if(confirm(`Bạn có chắc chắn muốn xóa vĩnh viễn bài:\n"${data.title}"?`)) {
                            try {
                                await deleteDoc(doc(db, "lessons", docId));
                                if(currentLessonId === docId) {
                                    document.getElementById("btnNewLesson").click();
                                }
                                loadLessons(); 
                            } catch (error) {
                                alert("Có lỗi xảy ra khi xóa: " + error.message);
                            }
                        }
                    };

                    listEl.appendChild(div);
                });
            } catch (error) {
                console.error("Lỗi tải dữ liệu:", error);
            }
        };

        loadLessons();

        document.getElementById("btnNewLesson").addEventListener("click", () => {
            currentLessonId = null;
            document.getElementById("lessonTitle").value = "";
            document.getElementById("lessonSubject").value = "";
            document.getElementById("sourceText").value = "";
            document.getElementById("saveStatus").innerText = "Đang soạn bài mới...";
            document.getElementById("practiceArea").innerHTML = `<div class="text-center mt-6 md:mt-20 text-gray-400 text-sm md:text-base"><p>Chế độ soạn thảo bài mới.</p></div>`;
            document.getElementById("sourceText").focus();
        });

        document.getElementById("btnSave").addEventListener("click", async () => {
            const statusText = document.getElementById("saveStatus");
            const btnSave = document.getElementById("btnSave");
            
            statusText.innerText = "Đang lưu...";
            statusText.className = "text-[10px] md:text-xs text-blue-500 italic";
            btnSave.disabled = true;

            let title = document.getElementById("lessonTitle").value.trim();
            const content = document.getElementById("sourceText").value.trim();
            const subject = document.getElementById("lessonSubject").value;

            if (!title && !content) {
                statusText.innerText = "Chưa có nội dung";
                statusText.className = "text-[10px] md:text-xs text-red-500 font-bold";
                btnSave.disabled = false;
                return; 
            }

            if (!title && content) {
                const lines = content.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length > 0) {
                    title = lines.slice(0, 2).join(' - ');
                    if(title.length > 60) title = title.substring(0, 60) + '...';
                    document.getElementById("lessonTitle").value = title;
                } else {
                    title = "Bài chưa đặt tên";
                }
            }

            try {
                const lessonData = {
                    title: title || "Bài chưa đặt tên",
                    content: content,
                    subject: subject,
                    timestamp: new Date()
                };

                if (currentLessonId) {
                    const lessonRef = doc(db, "lessons", currentLessonId);
                    await updateDoc(lessonRef, lessonData);
                } else {
                    const docRef = await addDoc(collection(db, "lessons"), lessonData);
                    currentLessonId = docRef.id; 
                }
                
                const now = new Date();
                statusText.innerText = `Đã lưu ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
                statusText.className = "text-[10px] md:text-xs text-green-600 font-medium";
                
                loadLessons(); 
            } catch (error) {
                statusText.innerText = "Lỗi lưu!";
                statusText.className = "text-[10px] md:text-xs text-red-500 font-bold";
                console.error(error);
            } finally {
                btnSave.disabled = false;
            }
        });

        function removeVietnameseTones(str) {
            if(!str) return "";
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            return str.toLowerCase().replace(/[^a-z0-9]/g, ""); 
        }

        function parseText() {
            const text = document.getElementById('sourceText').value;
            if(!text) {
                alert('Khung nhập chữ đang trống!');
                return null;
            }
            return text.split(/([\s,.\n:;!?]+)/); 
        }

        document.getElementById("btnMode1").addEventListener("click", () => {
            const tokens = parseText();
            if(!tokens) return;
            const area = document.getElementById('practiceArea');
            area.innerHTML = '<div class="text-[11px] md:text-sm text-gray-500 mb-3 font-normal italic">* Hướng dẫn: Chạm vào các khối màu tím để mở khóa từ bị ẩn.</div>';
            
            tokens.forEach(token => {
                if (/^[\s,.\n:;!?]+$/.test(token)) {
                    area.appendChild(document.createTextNode(token));
                } else if(token.trim() !== "") {
                    const span = document.createElement('span');
                    span.className = 'word-box hidden-word bg-indigo-200 text-transparent px-1.5 md:px-2 rounded select-none hover:bg-indigo-300 transition duration-300';
                    span.innerText = token;
                    span.onclick = () => {
                        span.classList.remove('bg-indigo-200', 'text-transparent', 'hover:bg-indigo-300');
                        span.classList.add('text-indigo-900', 'font-bold');
                    };
                    area.appendChild(span);
                }
            });
        });

        // ==========================================
        // CHẾ ĐỘ 2: ĐIỀN CHỖ TRỐNG - TỰ ĐỘNG FOCUS
        // ==========================================
        document.getElementById("btnMode2").addEventListener("click", () => {
            const tokens = parseText();
            if(!tokens) return;
            const area = document.getElementById('practiceArea');
            area.innerHTML = '<div class="text-[11px] md:text-sm text-gray-500 mb-3 font-normal italic">* Hướng dẫn: Các từ bị viền cam là từ bạn đã sai trước đó. Sai 3 lần hệ thống sẽ tự động điền và ghi nhớ!</div>';
            
            tokens.forEach(token => {
                if (/^[\s,.\n:;!?]+$/.test(token)) {
                    area.appendChild(document.createTextNode(token));
                } else if(token.trim() !== "") {
                    
                    let targetWord = removeVietnameseTones(token);
                    let isWrongPreviously = globalWrongWords.includes(targetWord);
                    
                    let shouldHide = isWrongPreviously || (Math.random() > 0.6);

                    if (!shouldHide) { 
                        area.appendChild(document.createTextNode(token));
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        
                        if (isWrongPreviously) {
                            input.className = 'word-box input-word transition-colors duration-200 text-base md:text-xl input-wrong-memory placeholder-orange-300';
                            input.placeholder = "?";
                        } else {
                            input.className = 'word-box input-word transition-colors duration-200 text-base md:text-xl';
                        }
                        
                        input.style.width = Math.max(50, token.length * 15) + "px"; 
                        
                        let mistakeCount = 0;
                        let isFirstTry = true;
                        
                        const focusNext = () => {
                            let nextInput = input.nextElementSibling;
                            while(nextInput && nextInput.tagName !== 'INPUT') {
                                nextInput = nextInput.nextElementSibling;
                            }
                            if(nextInput) nextInput.focus();
                        }

                        const handleCorrect = () => {
                            if (isWrongPreviously && isFirstTry) {
                                removeWrongWord(targetWord);
                            }

                            const span = document.createElement('span');
                            span.className = 'word-box bg-emerald-100 text-emerald-800 font-bold border-none rounded px-2';
                            span.innerText = token;
                            
                            focusNext();
                            input.parentNode.replaceChild(span, input);
                        };

                        const handleWrong = () => {
                            mistakeCount++;
                            isFirstTry = false; 

                            if (mistakeCount >= 3) {
                                addWrongWord(targetWord);
                                const span = document.createElement('span');
                                span.className = 'word-box bg-red-100 text-red-800 font-bold border-none rounded px-2';
                                span.innerText = token; 
                                
                                focusNext();
                                input.parentNode.replaceChild(span, input);
                            } else {
                                input.value = '';
                                input.classList.add('flash-error');
                                setTimeout(() => input.classList.remove('flash-error'), 500);
                            }
                        };
                        
                        input.addEventListener('input', (e) => {
                            let val = input.value;
                            if(val.includes(' ')) {
                                let cleanVal = removeVietnameseTones(val.replace(/\s/g, ''));
                                if(cleanVal === targetWord) {
                                    handleCorrect();
                                } else {
                                    handleWrong();
                                }
                            } else {
                                let cleanVal = removeVietnameseTones(val);
                                if(cleanVal === targetWord) {
                                    handleCorrect();
                                }
                            }
                        });
                        area.appendChild(input);
                    }
                }
            });

            // Tự động focus vào ô trống đầu tiên ngay khi render xong
            const firstInput = area.querySelector('input');
            if (firstInput) {
                firstInput.focus();
            }
        });

        document.getElementById("btnMode3").addEventListener("click", () => {
            const tokens = parseText();
            if(!tokens) return;
            const area = document.getElementById('practiceArea');
            area.innerHTML = '<div class="text-[11px] md:text-sm text-gray-500 mb-3 font-normal italic">* Hướng dẫn: Gõ liên tục phím chữ cái đầu tiên của từng từ để mở khóa (không phân biệt chữ hoa).</div>';
            
            const wordsData = [];
            tokens.forEach(token => {
                if (/^[\s,.\n:;!?]+$/.test(token)) {
                    const span = document.createElement('span');
                    span.innerText = token;
                    area.appendChild(span);
                } else if(token.trim() !== "") {
                    const span = document.createElement('span');
                    span.className = 'word-box text-transparent bg-amber-200 px-1 md:px-1.5 rounded transition-colors duration-300 border-b-2 border-amber-300';
                    span.innerText = token;
                    area.appendChild(span);
                    wordsData.push({ element: span, word: token });
                }
            });

            let currentIndex = 0;
            const keyHandler = (e) => {
                if(currentIndex >= wordsData.length) {
                    document.removeEventListener('keydown', keyHandler);
                    return;
                }
                const targetObj = wordsData[currentIndex];
                const expectedLetter = removeVietnameseTones(targetObj.word.charAt(0));
                const typedLetter = removeVietnameseTones(e.key);
                
                if(typedLetter === expectedLetter) {
                    targetObj.element.classList.remove('text-transparent', 'bg-amber-200', 'border-b-2', 'border-amber-300');
                    targetObj.element.classList.add('text-amber-900', 'font-bold');
                    currentIndex++;
                }
            };
            
            if(window.currentKeyHandler) document.removeEventListener('keydown', window.currentKeyHandler);
            window.currentKeyHandler = keyHandler;
            document.addEventListener('keydown', keyHandler);
        });
    </script>
</body>
</html>
