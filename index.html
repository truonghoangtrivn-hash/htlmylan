<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Học Thuộc Lòng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .word-box { display: inline-block; margin: 2px; }
        .hidden-word { cursor: pointer; user-select: none; }
        .input-word { width: 70px; text-align: center; border-bottom: 2px solid #ccc; outline: none; background-color: transparent; }
        .input-word:focus { border-bottom-color: #3b82f6; }
        /* Hiệu ứng chớp đỏ khi gõ sai */
        @keyframes flashRed {
            0% { background-color: #fca5a5; }
            100% { background-color: transparent; }
        }
        .flash-error { animation: flashRed 0.5s ease-out; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-gray-800">
    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- CỘT TRÁI: QUẢN LÝ DỮ LIỆU FIREBASE -->
        <div class="md:col-span-1 space-y-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <h2 class="font-bold text-lg mb-4 text-blue-700 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    1. Nhập văn bản mới
                </h2>
                <input type="text" id="lessonTitle" placeholder="Tên bài (VD: Tuyên Ngôn Độc Lập)" class="w-full mb-3 p-3 border rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none bg-gray-50">
                <textarea id="sourceText" rows="6" placeholder="Nhập văn bản bạn cần học thuộc lòng vào đây..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-300 focus:outline-none bg-gray-50 mb-3"></textarea>
                <button id="btnSave" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200 shadow-sm">
                    Lưu Lên Đám Mây
                </button>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <h2 class="font-bold text-lg mb-4 text-blue-700 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                    Thư viện bài học
                </h2>
                <div id="lessonList" class="space-y-2 text-sm max-h-[300px] overflow-y-auto pr-2">
                    <p class="text-gray-500 italic">Đang kết nối cơ sở dữ liệu...</p>
                </div>
            </div>
        </div>

        <!-- CỘT PHẢI: KHU VỰC TƯƠNG TÁC HỌC TẬP -->
        <div class="md:col-span-2 space-y-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 min-h-[550px] flex flex-col">
                <h2 class="font-bold text-lg mb-4 text-blue-700 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                    2. Chọn phương pháp học
                </h2>
                <div class="grid grid-cols-3 gap-3 mb-6">
                    <button id="btnMode1" class="py-3 px-2 bg-indigo-50 text-indigo-700 font-semibold rounded-lg hover:bg-indigo-100 border border-indigo-200 transition">👆 Chạm mở từ</button>
                    <button id="btnMode2" class="py-3 px-2 bg-emerald-50 text-emerald-700 font-semibold rounded-lg hover:bg-emerald-100 border border-emerald-200 transition">✍️ Điền chỗ trống</button>
                    <button id="btnMode3" class="py-3 px-2 bg-amber-50 text-amber-700 font-semibold rounded-lg hover:bg-amber-100 border border-amber-200 transition">⌨️ Gõ chữ cái đầu</button>
                </div>
                
                <div class="bg-slate-50 p-6 border rounded-xl flex-grow text-xl leading-loose overflow-y-auto" id="practiceArea">
                    <div class="text-center mt-20 text-gray-400">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        <p>Chọn một bài học bên trái và bắt đầu luyện tập</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MÃ JAVASCRIPT & FIREBASE -->
    <script type="module">
        // 1. Khai báo thư viện Firebase từ CDN (Dành cho trình duyệt)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // 2. Cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyB7dUr9hu-FJmcrb9oxUZ9rSY2nUzXobbw",
            authDomain: "htlmylan.firebaseapp.com",
            projectId: "htlmylan",
            storageBucket: "htlmylan.firebasestorage.app",
            messagingSenderId: "451089656401",
            appId: "1:451089656401:web:fa2837b5977f08b8a5e670"
        };

        // Khởi tạo Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- HÀM TẢI DANH SÁCH BÀI HỌC ---
        const loadLessons = async () => {
            const listEl = document.getElementById("lessonList");
            try {
                const q = query(collection(db, "lessons"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                listEl.innerHTML = "";
                
                if(querySnapshot.empty) {
                    listEl.innerHTML = "<p class='text-gray-500 italic text-sm'>Chưa có bài học nào được lưu.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement("div");
                    div.className = "p-3 bg-white border border-gray-100 shadow-sm rounded-lg cursor-pointer hover:border-blue-300 hover:shadow transition group";
                    div.innerHTML = `
                        <div class="font-semibold text-gray-800 group-hover:text-blue-600 transition">${data.title}</div>
                        <div class="text-xs text-gray-400 mt-1 truncate">${data.content.substring(0, 40)}...</div>
                    `;
                    div.onclick = () => {
                        document.getElementById("lessonTitle").value = data.title;
                        document.getElementById("sourceText").value = data.content;
                        document.getElementById("practiceArea").innerHTML = `
                            <div class="text-center mt-10">
                                <span class="inline-block px-4 py-1 bg-green-100 text-green-700 rounded-full text-sm font-semibold mb-4">Đã nạp bài học</span>
                                <h3 class="text-2xl font-bold text-gray-800">${data.title}</h3>
                                <p class="text-gray-500 mt-2 text-base">Hãy chọn một phương pháp học ở phía trên.</p>
                            </div>
                        `;
                    };
                    listEl.appendChild(div);
                });
            } catch (error) {
                console.error("Lỗi:", error);
                listEl.innerHTML = `<p class="text-red-500 text-sm">Không thể tải dữ liệu. Hãy kiểm tra lại Rule của Firestore đã được cấp quyền chưa.</p>`;
            }
        };

        // Tự động tải dữ liệu khi mở web
        loadLessons();

        // --- SỰ KIỆN LƯU BÀI HỌC ---
        document.getElementById("btnSave").addEventListener("click", async () => {
            const title = document.getElementById("lessonTitle").value.trim();
            const content = document.getElementById("sourceText").value.trim();
            const btn = document.getElementById("btnSave");

            if (!title || !content) {
                alert("Vui lòng nhập đầy đủ tên bài và nội dung!");
                return;
            }

            btn.innerText = "Đang lưu trữ...";
            btn.classList.add("opacity-75");
            btn.disabled = true;

            try {
                await addDoc(collection(db, "lessons"), {
                    title: title,
                    content: content,
                    timestamp: new Date()
                });
                
                document.getElementById("lessonTitle").value = "";
                document.getElementById("sourceText").value = "";
                
                // Hiển thị thông báo ngay trong khu vực học
                document.getElementById("practiceArea").innerHTML = `
                    <div class="text-center mt-20 text-green-600">
                        <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="text-xl font-bold">Lưu bài học thành công!</p>
                    </div>
                `;
                loadLessons(); // Refresh danh sách
            } catch (error) {
                alert("Lỗi lưu dữ liệu: " + error.message);
            } finally {
                btn.innerText = "Lưu Lên Đám Mây";
                btn.classList.remove("opacity-75");
                btn.disabled = false;
            }
        });


        // ==========================================
        // KHU VỰC XỬ LÝ LOGIC HỌC THUỘC LÒNG
        // ==========================================

        // Hàm chuẩn hóa tiếng Việt cực mạnh (Bỏ dấu, đưa về chữ thường)
        function removeVietnameseTones(str) {
            if(!str) return "";
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            // Xóa các ký tự đặc biệt chỉ giữ lại chữ cái và số
            str = str.replace(/[^a-z0-9]/g, ""); 
            return str.toLowerCase();
        }

        // Tách văn bản thành mảng các từ và dấu câu
        function parseText() {
            const text = document.getElementById('sourceText').value;
            if(!text) {
                alert('Bạn cần chọn một bài học từ thư viện hoặc nhập nội dung mới.');
                return null;
            }
            return text.split(/([\s,.\n:;!?]+)/); 
        }

        // --- Chế độ 1: Chạm để mở từ ---
        document.getElementById("btnMode1").addEventListener("click", () => {
            const tokens = parseText();
            if(!tokens) return;
            const area = document.getElementById('practiceArea');
            area.innerHTML = '<div class="text-sm text-gray-500 mb-4 font-normal">* Hướng dẫn: Chạm vào các khối màu tím để mở khóa từ bị ẩn.</div>';
            
            tokens.forEach(token => {
                if (/^[\s,.\n:;!?]+$/.test(token)) {
                    area.appendChild(document.createTextNode(token));
                } else if(token.trim() !== "") {
                    const span = document.createElement('span');
                    span.className = 'word-box hidden-word bg-indigo-200 text-transparent px-2 rounded select-none hover:bg-indigo-300 transition duration-300';
                    span.innerText = token;
                    span.onclick = () => {
                        span.classList.remove('bg-indigo-200', 'text-transparent', 'hover:bg-indigo-300');
                        span.classList.add('text-indigo-900', 'font-bold');
                    };
                    area.appendChild(span);
                }
            });
        });

        // --- Chế độ 2: Điền chỗ trống (Tự động xóa nếu sai) ---
        document.getElementById("btnMode2").addEventListener("click", () => {
            const tokens = parseText();
            if(!tokens) return;
            const area = document.getElementById('practiceArea');
            area.innerHTML = '<div class="text-sm text-gray-500 mb-4 font-normal">* Hướng dẫn: Gõ từ còn thiếu. Ô sẽ tự chuyển xanh nếu gõ đúng không dấu. <br><span class="text-red-500">* Mẹo: Nếu lỡ gõ sai, chỉ cần bấm phím Cách (Space), ô sẽ tự xóa để gõ lại.</span></div>';
            
            tokens.forEach(token => {
                if (/^[\s,.\n:;!?]+$/.test(token)) {
                    area.appendChild(document.createTextNode(token));
                } else if(token.trim() !== "") {
                    if (Math.random() > 0.4) { 
                        // 60% hiện từ
                        area.appendChild(document.createTextNode(token));
                    } else {
                        // 40% tạo input
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'word-box input-word transition-colors duration-200';
                        // Đặt kích thước ô vừa phải
                        input.style.width = Math.max(50, token.length * 12) + "px"; 
                        
                        input.addEventListener('input', (e) => {
                            let val = input.value;
                            let targetWord = removeVietnameseTones(token); // Đáp án đã chuẩn hóa
                            
                            // Nếu người dùng bấm dấu cách (Space)
                            if(val.includes(' ')) {
                                let cleanVal = removeVietnameseTones(val.replace(/\s/g, ''));
                                
                                if(cleanVal === targetWord) {
                                    // ĐÚNG: Khóa xanh
                                    input.value = token;
                                    input.className = 'word-box input-word bg-emerald-100 text-emerald-800 font-bold border-none rounded px-1';
                                    input.disabled = true;
                                } else {
                                    // SAI: Chớp đỏ, tự động xóa sạch, không cho sang từ khác
                                    input.value = '';
                                    input.classList.add('flash-error');
                                    setTimeout(() => input.classList.remove('flash-error'), 500);
                                }
                            } else {
                                // Real-time kiểm tra từng ký tự đang gõ
                                let cleanVal = removeVietnameseTones(val);
                                if(cleanVal === targetWord) {
                                    // ĐÚNG: Khóa xanh ngay lập tức không cần bấm Space
                                    input.value = token;
                                    input.className = 'word-box input-word bg-emerald-100 text-emerald-800 font-bold border-none rounded px-1';
                                    input.disabled = true;
                                    // Chuyển focus sang ô input kế tiếp (nếu có)
                                    const nextInput = input.nextElementSibling;
                                    if(nextInput && nextInput.tagName === 'INPUT') nextInput.focus();
                                }
                            }
                        });
                        area.appendChild(input);
                    }
                }
            });
        });

        // --- Chế độ 3: Gõ chữ cái đầu ---
        document.getElementById("btnMode3").addEventListener("click", () => {
            const tokens = parseText();
            if(!tokens) return;
            const area = document.getElementById('practiceArea');
            area.innerHTML = '<div class="text-sm text-gray-500 mb-4 font-normal">* Hướng dẫn: Gõ liên tục phím chữ cái đầu tiên của từng từ để mở khóa.</div>';
            
            const wordsData = [];
            tokens.forEach(token => {
                if (/^[\s,.\n:;!?]+$/.test(token)) {
                    const span = document.createElement('span');
                    span.innerText = token;
                    area.appendChild(span);
                } else if(token.trim() !== "") {
                    const span = document.createElement('span');
                    span.className = 'word-box text-transparent bg-amber-200 px-1 rounded transition-colors duration-300 border-b-2 border-amber-300';
                    span.innerText = token;
                    area.appendChild(span);
                    wordsData.push({ element: span, word: token });
                }
            });

            let currentIndex = 0;
            const keyHandler = (e) => {
                if(currentIndex >= wordsData.length) {
                    document.removeEventListener('keydown', keyHandler);
                    return;
                }
                const targetObj = wordsData[currentIndex];
                const expectedLetter = removeVietnameseTones(targetObj.word.charAt(0));
                
                if(removeVietnameseTones(e.key) === expectedLetter) {
                    targetObj.element.classList.remove('text-transparent', 'bg-amber-200', 'border-b-2', 'border-amber-300');
                    targetObj.element.classList.add('text-amber-900', 'font-bold');
                    currentIndex++;
                }
            };
            
            // Đảm bảo không bị trùng lặp sự kiện khi bấm nhiều lần
            if(window.currentKeyHandler) {
                document.removeEventListener('keydown', window.currentKeyHandler);
            }
            window.currentKeyHandler = keyHandler;
            document.addEventListener('keydown', keyHandler);
        });
    </script>
</body>
</html>
